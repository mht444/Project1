{% extends 'base.html' %}
{% block content %}
{% load static %}

<style>
.travel-form .form-row {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    width: 100%;
}

.travel-form .form-group {
    flex: 1;
    min-width: 180px;
    margin-bottom: 0;
}

.travel-form label {
    font-weight: 500;
    color: #495057;
    margin-bottom: 6px;
    display: block;
    font-size: 14px;
}

.travel-form .form-control {
    border-radius: 6px;
    border: 1px solid #e1e5e9;
    padding: 8px 12px;
    transition: border-color 0.3s;
    font-size: 14px;
}

.travel-form .form-control:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
}

/* 提交按钮美化 */
#submitBtn {
    background: #667eea;
    border: none;
    border-radius: 6px;
    padding: 10px 24px;
    font-weight: 500;
    transition: background-color 0.3s;
    white-space: nowrap;
    min-width: 160px;
    height: fit-content;
}

#submitBtn:hover {
    background: #5a6fd8;
}

/* 卡片和头部样式优化 */
.card {
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    border: none;
    overflow: hidden;
}

.card-header {
    background-color: #f8f9fa;
    border-bottom: 1px solid #e9ecef;
    padding: 12px 20px;
    margin: 0;
}

.card-header h5 {
    margin: 0;
    font-weight: 600;
    color: #343a40;
    font-size: 16px;
}

.card-block {
    padding: 20px;
    background-color: #ffffff;
}

/* 小提示文字样式 */
.form-text {
    font-size: 12px;
    color: #6c757d;
    margin-top: 4px;
}
</style>

<div class="pcoded-content">
    <!-- Page-header start -->
    <div class="page-header">
        <div class="page-block">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <div class="page-header-title">
                        <h5 class="m-b-10">AI旅游路线推荐</h5>
                        <p class="m-b-0">智能规划行程</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <ul class="breadcrumb-title">
                        <li class="breadcrumb-item">
                            <a href="{% url 'home:index' %}"> <i class="fa fa-home"></i> </a>
                        </li>
                        <li class="breadcrumb-item"><a href="#!">AI智能推荐</a>
                        </li>
                        <li class="breadcrumb-item"><a href="#!">AI旅游路线推荐</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <!-- Page-header end -->
    <div class="pcoded-inner-content">
        <!-- Main-body start -->
        <div class="main-body">
            <div class="page-wrapper">
                <div class="page-body">
                    <div class="row">
                        <div class="col-md-12 col-lg-12">
                            <div class="card">
                                <div class="card-header">
                                    <h5>景点评分分布</h5>
                                </div>
                                <div class="card-block">
                                    <form id="travelForm" class="travel-form">
                                        <div class="form-row">
                                            <div class="form-group">
                                                <label for="city">目的地城市</label>
                                                <input type="text" class="form-control" id="city" placeholder="例如：北京、上海" required>
                                            </div>

                                            <div class="form-group">
                                                <label for="season">旅行季节</label>
                                                <select class="form-control" id="season" required>
                                                    <option value="spring">春季（3-5月）</option>
                                                    <option value="summer">夏季（6-8月）</option>
                                                    <option value="autumn">秋季（9-11月）</option>
                                                    <option value="winter">冬季（12-2月）</option>
                                                </select>
                                            </div>

                                            <div class="form-group">
                                                <label for="days">行程天数</label>
                                                <input type="number" class="form-control" id="days" min="1" max="14" value="3" required>
                                                <small class="form-text text-muted">建议1-14天</small>
                                            </div>

                                            <div class="form-group">
                                                <label for="budget">总预算(元)</label>
                                                <input type="number" class="form-control" id="budget" min="0" value="0">
                                                <small class="form-text text-muted">0表示不限预算</small>
                                            </div>

                                            <div class="form-group">
                                                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                                                    <i class="fa fa-rocket mr-2"></i>生成推荐路线
                                                </button>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 加载状态 -->
                    <div class="row" id="loadingContainer" style="display: none;">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-block text-center p-5">
                                    <div class="spinner-border text-primary mb-3" role="status">
                                        <span class="sr-only">加载中...</span>
                                    </div>
                                    <h5 class="mb-2">正在生成路线</h5>
                                    <p class="text-muted">AI正在为您规划最佳行程，请稍候...</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 错误提示 -->
                    <div class="row" id="errorContainer" style="display: none;">
                        <div class="col-lg-12">
                            <div class="alert alert-danger" role="alert">
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                                <i class="fa fa-exclamation-circle mr-2"></i>
                                <strong>错误：</strong><span id="errorMessage"></span>
                            </div>
                        </div>
                    </div>

                    <!-- 结果展示区域 -->
                    <div class="row" id="resultContainer" style="display: none;">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="card-header">AI推荐旅游路线</h5>
                                    <span style="color: red; font-size: 12px;">AI智能的旅游景点经纬度可能与实际不符，经纬度仅供参考！！！</span>
                                </div>
                                <div class="card-block">
                                    <!-- 地图容器 -->
                                    <div id="map" style="width:100%; height:600px; margin-botton:20px;"></div>

                                    <!-- 路线详情表格 -->
                                    <div class="table-responsive">
                                        <table class="table table-striped table-bordered" id="routeTable">
                                            <thead class="thead-dark">
                                                <tr>
                                                    <th>景点名称</th>
                                                    <th>游玩时间</th>
                                                    <th>景点特点</th>
                                                    <th>预计花费</th>
                                                    <th>位置</th>
                                                </tr>
                                            </thead>
                                            <tbody id="routeTableBody">
                                            <!-- 表格内容将通过JavaScript动态填充 -->
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
        <div id="styleSelector"></div>
    </div>
    <script src="{% static 'assets/js/echarts/echarts.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'assets/js/jquery/jquery.min.js' %}"></script>

    <script type="text/javascript" src="https://api.map.baidu.com/api?v=3.0&ak=lwDGhtB8uO80CNTbV0l7oQlzajMxrj0c"></script>
    <style>
        /* 蓝色数字标记样式 */
        .blue-number-marker {
            width: 32px;
            height: 32px;
            background-color: #1677ff;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        /* 天数标签样式 */
        .marker-day {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 4px;
        }
    </style>

    <script>
        $(document).ready(function () {
               let map = null;
               let BMap = window.BMap;
               let markers = [];
               let polylines = [];

               // 初始化地图
               function initMap() {
                   if (!BMap) {
                       console.error('百度地图API未加载');
                       return false;
                   }

                   try {
                       map = new BMap.Map('map');
                       // 设置默认中心点为北京
                       const point = new BMap.Point(116.404, 39.915);
                       map.centerAndZoom(point, 11);
                       map.enableScrollWheelZoom(true);

                       // 添加地图控件
                       map.addControl(new BMap.NavigationControl());
                       map.addControl(new BMap.ScaleControl());
                       map.addControl(new BMap.OverviewMapControl());
                       map.addControl(new BMap.MapTypeControl());

                       console.log('百度地图初始化成功');
                       return true;
                   } catch (error) {
                       console.error('地图初始化失败:', error);
                       showError('地图初始化失败: ' + error.message);
                       return false;
                   }
               }

               // 显示错误信息
               function showError(message) {
                   $('#errorMessage').text(message);
                   $('#errorContainer').show();
               }

               // 隐藏错误信息
               function hideError() {
                   $('#errorContainer').hide();
               }

               // 显示加载状态
               function showLoading() {
                   $('#loadingContainer').show();
               }

               // 隐藏加载状态
               function hideLoading() {
                   $('#loadingContainer').hide();
               }

               // 显示结果
               function showResult() {
                   $('#resultContainer').show();
               }

               // 隐藏结果
               function hideResult() {
                   $('#resultContainer').hide();
               }

               // 创建自定义标记类 - 修复标记抖动问题
               function CustomMarker(point, number, dayInfo) {
                   this._point = point;
                   this._number = number;
                   this._dayInfo = dayInfo;
               }

               CustomMarker.prototype = new BMap.Overlay();
               CustomMarker.prototype.initialize = function (map) {
                   this._map = map;

                   const markerDiv = document.createElement('div');
                   markerDiv.className = 'custom-marker';
                   // 修改为蓝色数字框样式
                   markerDiv.innerHTML = `
                       <div class="blue-number-marker">${this._number}</div>
                       <div class="marker-day">${this._dayInfo}</div>
                   `;

                   markerDiv.style.position = 'absolute';
                   markerDiv.style.zIndex = BMap.Overlay.getZIndex(this._point.lat);
                   markerDiv.style.pointerEvents = 'auto';

                   // 设置初始位置
                   const pixel = this._map.pointToOverlayPixel(this._point);
                   markerDiv.style.left = pixel.x - (markerDiv.offsetWidth / 2) + 'px';
                   markerDiv.style.top = pixel.y - markerDiv.offsetHeight + 'px';

                   this._div = markerDiv;
                   map.getPanes().markerPane.appendChild(markerDiv);

                   return markerDiv;
               };

               CustomMarker.prototype.draw = function () {
                   if (this._div) {
                       const pixel = this._map.pointToOverlayPixel(this._point);
                       this._div.style.left = pixel.x - (this._div.offsetWidth / 2) + 'px';
                       this._div.style.top = pixel.y - this._div.offsetHeight + 'px';
                   }
               };

               // 清除地图上的标记和路线
               function clearMap() {
                   if (map) {
                       map.clearOverlays();
                       markers = [];
                       polylines = [];
                   }
               }

               // 在地图上标记路线
               function markRouteOnMap(routeData) {
                   if (!map || !BMap || !routeData.length) {
                       console.error('地图未初始化或没有数据');
                       return;
                   }

                   try {
                       clearMap();
                       const points = [];

                       // 过滤出有有效坐标的点
                       const validPoints = routeData.filter(item =>
                           item.longitude && item.latitude &&
                           !isNaN(item.longitude) && !isNaN(item.latitude)
                       );

                       if (validPoints.length === 0) {
                           showError('没有有效的坐标数据可供显示');
                           return;
                       }

                       console.log('有效坐标点:', validPoints);

                       // 提取天数信息用于标记
                       const dayInfoMap = new Map();
                       validPoints.forEach((item, index) => {
                           const dayMatch = item.visit_time?.match(/第(\d+)天/);
                           const day = dayMatch ? parseInt(dayMatch[1]) : index + 1;
                           dayInfoMap.set(index, `D${day}`);
                       });

                       validPoints.forEach((item, index) => {
                           const point = new BMap.Point(item.longitude, item.latitude);
                           points.push(point);

                           // 创建自定义标记
                           const dayInfo = dayInfoMap.get(index) || `D${index + 1}`;
                           const customMarker = new CustomMarker(point, index + 1, dayInfo);

                           map.addOverlay(customMarker);
                           markers.push(customMarker);

                           // 信息窗口内容
                           const infoContent = `
                               <div style="min-width:280px;padding:15px;font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;">
                                   <h4 style="margin:0 0 12px 0;color:#4a90e2;font-size:18px;border-bottom:2px solid #4a90e2;padding-bottom:8px;">
                                       ${item.name || '未知景点'}
                                   </h4>
                                   <div style="margin-bottom:10px;">
                                       <span style="background:#4a90e2;color:white;padding:4px 8px;border-radius:4px;font-size:12px;">
                                           ${item.visit_time || '时间待定'}
                                       </span>
                                   </div>
                                   <p style="margin:8px 0;color:#666;line-height:1.6;">
                                       <strong style="color:#333;">特点:</strong> ${item.features || '暂无描述'}
                                   </p>
                                   <p style="margin:8px 0;color:#ff6b35;font-weight:bold;">
                                       <strong>预计花费:</strong> ${item.estimated_cost || '免费'}
                                   </p>
                                   <p style="margin:8px 0;color:#888;font-size:12px;">
                                       坐标: ${item.latitude.toFixed(4)}, ${item.longitude.toFixed(4)}
                                   </p>
                               </div>
                           `;

                           const infoWindow = new BMap.InfoWindow(infoContent, {
                               width: 320,
                               height: 220,
                               title: '景点详细信息',
                               enableMessage: false
                           });

                           // 添加点击事件到标记
                           customMarker._div.addEventListener('click', function (e) {
                               e.stopPropagation();
                               map.openInfoWindow(infoWindow, point);
                           });
                       });

                       // 绘制连接线
                       if (points.length > 1) {
                           const polyline = new BMap.Polyline(points, {
                               strokeColor: "#4a90e2",
                               strokeWeight: 5,
                               strokeOpacity: 0.8,
                               strokeStyle: 'solid'
                           });
                           map.addOverlay(polyline);
                           polylines.push(polyline);
                       }

                       // 调整地图视野，添加一些边距
                       if (points.length > 0) {
                           const viewport = map.getViewport(points);
                           const zoom = Math.min(viewport.zoom - 1, 18);
                           map.centerAndZoom(viewport.center, zoom);
                       }

                       console.log('成功在地图上标记了', validPoints.length, '个景点');
                   } catch (error) {
                       console.error('地图标记失败:', error);
                       showError('地图标记失败: ' + error.message);
                   }
               }

               // 填充路线表格
               function fillRouteTable(routeData) {
                   const tableBody = $('#routeTableBody');
                   tableBody.empty();

                   routeData.forEach(function (item) {
                       const row = $('<tr></tr>');

                       row.append($('<td></td>').text(item.name || ''));
                       row.append($('<td></td>').text(item.visit_time || ''));
                       row.append($('<td></td>').text(item.features || ''));
                       row.append($('<td></td>').text(item.estimated_cost || ''));

                       const locationText = (item.latitude && item.longitude)
                           ? `${item.latitude.toFixed(4)}, ${item.longitude.toFixed(4)}`
                           : '未知';
                       row.append($('<td></td>').text(locationText));

                       tableBody.append(row);
                   });
               }

               // 提交表单处理
               $('#travelForm').on('submit', function (e) {
                   e.preventDefault();

                   const city = $('#city').val().trim();
                   const season = $('#season').val();
                   const days = $('#days').val();
                   const budget = $('#budget').val();

                   if (!city) {
                       showError('请填写目的地城市');
                       return;
                   }

                   if (!season) {
                       showError('请选择旅行季节');
                       return;
                   }

                   hideError();
                   hideResult();
                   showLoading();

                   // 禁用提交按钮
                   $('#submitBtn').prop('disabled', true).text('生成中...');

                   // 准备请求数据
                   const requestData = {
                       city: city,
                       season: season,
                       days: days,
                       budget: budget || 0
                   };

                   console.log('发送请求数据:', requestData);

                   // 发送AJAX请求到后端API
                   $.ajax({
                       url: '{% url "home:get_ai_travelRoute" %}',
                       type: 'POST',
                       contentType: 'application/json',
                       data: JSON.stringify(requestData),
                       headers: {
                           'X-CSRFToken': '{{ csrf_token }}'
                       },
                       success: function (response) {
                           console.log('API响应:', response);
                           if (response.code === 200) {
                               // 成功获取路线数据
                               fillRouteTable(response.data);
                               markRouteOnMap(response.data);
                               showResult();
                           } else {
                               showError(response.message || '生成路线失败');
                           }
                       },
                       error: function (xhr, status, error) {
                           console.error('API请求失败:', error);
                           showError('网络错误，请重试: ' + error);
                       },
                       complete: function () {
                           hideLoading();
                           $('#submitBtn').prop('disabled', false).html('<i class="fa fa-rocket mr-2"></i>生成推荐路线');
                       }
                   });
               });

               // 初始化地图
               if (!initMap()) {
                   showError('地图初始化失败，可能影响路线可视化');
               }
           });
    </script>
{% endblock %}
