{% extends 'base.html' %}
{% block content %}
    {% load static %}
                    <div class="pcoded-content">
                        <!-- Page-header start -->
                        <div class="page-header">
                            <div class="page-block">
                                <div class="row align-items-center">
                                    <div class="col-md-8">
                                        <div class="page-header-title">
                                            <h5 class="m-b-10">景点评分信息</h5>
                                            <p class="m-b-0">景点评分信息可视化</p>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <ul class="breadcrumb-title">
                                            <li class="breadcrumb-item">
                                                <a href="{% url 'home:index' %}"> <i class="fa fa-home"></i> </a>
                                            </li>
                                            <li class="breadcrumb-item"><a href="#!">数据可视化</a>
                                            </li>
                                            <li class="breadcrumb-item"><a href="#!">景点评分信息</a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Page-header end -->
                        <div class="pcoded-inner-content">
                            <!-- Main-body start -->
                            <div class="main-body">
                                <div class="page-wrapper">
                                    <div class="page-body">
                                        <div class="row">

                                            <div class="col-md-12 col-lg-6">
                                                <div class="card">
                                                    <div class="card-header">
                                                        <h5>景点评分分布</h5>
                                                    </div>
                                                    <div class="card-block">
                                                        <div id="part1" style="width:100%;height:600px;"></div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="col-md-12 col-lg-6">
                                                <div class="card">
                                                    <div class="card-header">
                                                        <h5>各省份景点平均评分</h5>
                                                    </div>
                                                    <div class="card-block">
                                                        <div id="part8" style="width:100%;height:600px;"></div>
                                                    </div>
                                                </div>
                                            </div>
                                           </div>
                                        </div>
                                </div>
                            </div>
                            <div id="styleSelector">

                            </div>
                        </div>
                    </div>
        <script src="{% static 'assets/js/echarts/echarts.min.js' %}"></script>
        <script>
                var chartDom = document.getElementById('part1');
                var myChart = echarts.init(chartDom);
                var option;

                option = {
                  tooltip: {
                    trigger: 'item'
                  },
                  legend: {
                    orient: 'vertical',
                    left: 'left'
                  },
                  series: [
                    {
                      name: '评分',
                      type: 'pie',
                      radius: '50%',
                      data:{{data_list|safe}},
                      emphasis: {
                        itemStyle: {
                          shadowBlur: 10,
                          shadowOffsetX: 0,
                          shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                      }
                    }
                  ]
                };

                option && myChart.setOption(option);
        </script>
        <script>
            var chartDom = document.getElementById('part8');
            var myChart = echarts.init(chartDom);
            var option;

            option = {
              tooltip: {
                trigger: 'axis',
                axisPointer: {
                  type: 'cross',
                  crossStyle: {
                    color: '#999'
                  }
                }
              },
              toolbox: {
                feature: {
                  dataView: { show: true, readOnly: false },
                  magicType: { show: true, type: ['line', 'bar'] },
                  restore: { show: true },
                  saveAsImage: { show: true }
                }
              },
              legend: {
                data: ['景点数量', '平均评分']
              },
                grid: {
                left: '0%',    // 图表左侧距离容器左边的距离（默认是'10%'，改小就左移）
                right: '10%',  // 右侧边距（保持默认，避免右移）
                top: '15%',    // 顶部边距
                bottom: '15%', // 底部边距
                containLabel: true // 确保标签不会超出grid范围
              },
              xAxis: [
                {
                  type: 'category',
                  data:{{ name_list|safe }},
                  axisPointer: {
                    type: 'shadow'
                  }
                }
              ],
              yAxis: [
                {
                  type: 'value',
                  name: '景点数量',
                  min: 0,
                  max: 250,
                  interval: 50,
                  axisLabel: {
                    formatter: '{value} ml'
                  }
                },
                {
                  type: 'value',
                  name: '平均评分',
                  min: 0,
                  max: 5,
                  interval: 1,
                  axisLabel: {
                    formatter: '{value} °C'
                  }
                }
              ],
              series: [
                {
                  name: '景点数量',
                  type: 'bar',
                  tooltip: {
                    valueFormatter: function (value) {
                      return value + ' ml';
                    }
                  },
                  data:{{ travel_num_list|safe }},
                },
                {
                  name: '平均评分',
                  type: 'line',
                  yAxisIndex:1,
                  tooltip: {
                    valueFormatter: function (value) {
                      return value + ' ml';
                    }
                  },
                  data: {{ avg_score_list|safe }},
                },
              ]
            };

            option && myChart.setOption(option);
        </script>
{% endblock %}
