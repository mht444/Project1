{% extends 'base.html' %}
{% block content %}
    {% load static %}
                    <div class="pcoded-content">
                        <!-- Page-header start -->
                        <div class="page-header">
                            <div class="page-block">
                                <div class="row align-items-center">
                                    <div class="col-md-8">
                                        <div class="page-header-title">
                                            <h5 class="m-b-10">个人信息管理</h5>
                                            <p class="m-b-0">个人信息</p>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <ul class="breadcrumb-title">
                                            <li class="breadcrumb-item">
                                                <a href="{% url 'home:index' %}"> <i class="fa fa-home"></i> </a>
                                            </li>
                                            <li class="breadcrumb-item"><a href="#!">个人中心</a>
                                            </li>
                                            <li class="breadcrumb-item"><a href="#!">个人信息管理</a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Page-header end -->
                        <div class="pcoded-inner-content">
                            <div class="main-body">
                                <div class="page-wrapper">
                                    <!-- Page-body start -->
                                    <div class="page-body">
                                        <div class="profile-container">
                                            <!-- 消息提示 -->
                                            {% if success %}
                                            <div class="alert alert-success">
                                                <i class="fa fa-check-circle"></i> {{ success }}
                                            </div>
                                            {% endif %}

                                            {% if error %}
                                            <div class="alert alert-error">
                                                <i class="fa fa-exclamation-circle"></i> {{ error }}
                                            </div>
                                            {% endif %}

                                            <!-- 头像上传区域 -->
                                            <div class="avatar-section">
                                                <h3 class="section-title">个人头像</h3>
                                                <img id="avatarPreview"
                                                     src="{% if user.avatar %}{{ user.avatar }}{% else %}{% static 'assets/images/user-default-avatar.png' %}{% endif %}"
                                                     alt="头像预览"
                                                     class="avatar-preview"
                                                     style="width: 200px; height: 200px; object-fit: cover;">
                                                <br>
                                                <input type="file" id="avatarInput" class="avatar-input" accept="image/*">
                                                <button type="button" class="avatar-upload-btn" onclick="document.getElementById('avatarInput').click()">
                                                    <i class="fa fa-camera"></i> 更换头像
                                                </button>
                                                <p class="file-hint">
                                                    支持 JPG、PNG、GIF 格式，大小不超过 2MB
                                                </p>
                                            </div>

                                            <!-- 个人信息表单 -->
                                            <div class="form-section">
                                                <h3 class="section-title">基本信息</h3>
                                                <form method="post" id="profileForm">
                                                    {% csrf_token %}
                                                    <div class="form-group">
                                                        <label class="form-label">用户名</label>
                                                        <input type="text" class="form-control" name="username" value="{{ user.username }}" required>
                                                    </div>

                                                    <div class="form-group">
                                                        <label class="form-label">电子邮箱</label>
                                                        <input type="email" class="form-control" name="email" value="{{ user.email }}" required>
                                                    </div>

                                                    <div class="form-group">
                                                        <label class="form-label">手机号码</label>
                                                        <input type="tel" class="form-control" name="phone" value="{{ user.phone }}">
                                                    </div>

                                                    <div class="form-group">
                                                        <label class="form-label">地址</label>
                                                        <input type="text" class="form-control" name="address" value="{{ user.address }}">
                                                    </div>

                                                    <div class="form-group">
                                                        <label class="form-label">邮编</label>
                                                        <input type="text" class="form-control" name="youbian" value="{{ user.youbian }}">
                                                    </div>

                                                    <div class="form-group">
                                                        <button type="submit" class="btn btn-primary">
                                                            <i class="fa fa-save"></i> 保存修改
                                                        </button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
        <script type="text/javascript" src="{% static 'assets/js/jquery/jquery.min.js' %}"></script>

        <script>
$(document).ready(function () {
    // 显示消息
    function showMessage(message, type) {
        // 创建消息元素
        const messageDiv = $(`<div class="alert"></div>`)
            .addClass(type === 'success' ? 'alert-success' : 'alert-error')
            .html(`<i class="fa ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ` + message);

        // 插入到容器顶部
        $('.profile-container').prepend(messageDiv);

        // 3秒后自动消失
        setTimeout(() => {
            messageDiv.fadeOut(() => messageDiv.remove());
        }, 3000);
    }

    // 头像上传处理
    $('#avatarInput').on('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;

        // 预览图片
        const reader = new FileReader();
        reader.onload = function (e) {
            $('#avatarPreview').attr('src', e.target.result);
        };
        reader.readAsDataURL(file);

        // 上传文件
        const formData = new FormData();
        formData.append('avatar', file);
        formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

        $.ajax({
            url: '{% url "user:upload_avatar" %}',
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function (response) {
                if (response.code === 200) {
                    showMessage(response.msg, 'success');
                    // 更新页面上的头像
                    $('#avatarPreview').attr('src', response.avatar_url);
                    // 更新导航栏头像（如果存在）
                    const navAvatar = $('.main-menu-header img');
                    if (navAvatar.length) {
                        navAvatar.attr('src', response.avatar_url);
                    }
                } else {
                    showMessage(response.msg, 'error');
                }
            },
            error: function () {
                showMessage('上传失败，请重试', 'error');
            }
        });
    });
});
        </script>

{% endblock %}
